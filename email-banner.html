<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeBuild Co — Email capture banner</title>

<!-- DM Sans = brand face. The other three families exist only for the rotating word. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap" rel="stylesheet">

<style>
/* Tokens mirror src/app.css. Standalone on purpose: renders without the Tailwind build. */
:root{
  --color-obsidian:#09090b; --color-ink:#18181b; --color-steel:#71717a;
  --color-ash:#a1a1aa;      --color-mist:#f4f4f5; --color-snow:#ffffff;
  --color-lime:#c8e636;
  --font-cosmica:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius-3xl-4:40px; --radius-full-5:1000px;
  --shadow-md:rgba(0,0,0,.04) 0 4px 12px;
  --shadow-lg:rgba(0,0,0,.10) 0 18px 44px -8px;

  --word-count:4;   /* keep in sync with the number of .rotate > span */
  --cycle:11.2s;
}

*{box-sizing:border-box}
body{
  margin:0; padding:48px 24px; background:var(--color-snow);
  font-family:var(--font-cosmica); -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:100vh;
}

/* ---------- shell ---------- */
.banner{
  position:relative; width:100%; min-width:0; max-width:1240px; overflow:hidden;
  background:var(--color-mist); border-radius:var(--radius-3xl-4);
  box-shadow:var(--shadow-lg);
  padding:60px clamp(28px,4.6vw,72px);
  min-height:420px; display:flex; align-items:center;
}
.copy{position:relative; z-index:2; max-width:740px}

/* ---------- headline ---------- */
h1{
  margin:0 0 38px; color:var(--color-obsidian);
  font-weight:500; letter-spacing:-.035em; line-height:1.05;
  font-size:clamp(30px,4.4vw,54px);
}
h1 .l2{display:block}

/* Rotating slot: every word occupies the same grid cell, so the slot is as wide as
   the widest word and the line below never reflows. The word sits at the end of its
   line, so the slack to its right is invisible — hence no width animation needed. */
.rotate{display:inline-grid; vertical-align:top; color:var(--color-ash)}
.rotate>span{
  grid-area:1/1; white-space:nowrap;
  opacity:0; will-change:opacity,transform,filter;
  animation:word-cycle var(--cycle) infinite both;
  animation-delay:calc(var(--i) * (var(--cycle) / var(--word-count)));
}
/* 4 words → each owns 25% of the cycle: in 0–5%, hold 5–20%, out 20–25%. */
@keyframes word-cycle{
  0%       {opacity:0; transform:translateY(.34em); filter:blur(7px)}
  5%,20%   {opacity:1; transform:none;              filter:blur(0)}
  25%,100% {opacity:0; transform:translateY(-.34em);filter:blur(7px)}
}

/* The whole point: each word arrives in a different typeface. */
.w-sans   {font-family:var(--font-cosmica); font-weight:500}
.w-serif  {font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-weight:400; letter-spacing:-.01em}
.w-mono   {font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:500; letter-spacing:-.07em; font-size:.86em}
.w-grotesk{font-family:'Bricolage Grotesque',var(--font-cosmica); font-weight:600; letter-spacing:-.045em}

/* ---------- form ---------- */
.form{
  display:flex; align-items:center; gap:8px;
  background:var(--color-snow); border-radius:var(--radius-full-5);
  padding:8px 8px 8px 24px; max-width:460px;
  box-shadow:var(--shadow-md);
}
.form input{
  flex:1; min-width:0; border:0; outline:0; background:transparent;
  font:inherit; font-size:15px; color:var(--color-ink); padding:12px 0;
}
.form input::placeholder{color:var(--color-ash)}
.form:focus-within{box-shadow:0 0 0 3px rgba(200,230,54,.6),var(--shadow-md)}
.form button{
  flex:0 0 auto; border:0; cursor:pointer; font:inherit; font-weight:500; font-size:15px;
  background:var(--color-obsidian); color:var(--color-snow);
  padding:14px 26px; border-radius:var(--radius-full-5);
  transition:background .2s ease, transform .2s ease;
}
.form button:hover{background:var(--color-ink); transform:translateY(-1px)}
.form button:active{transform:translateY(0)}
.note{margin:16px 0 0; font-size:13px; color:var(--color-steel); letter-spacing:-.01em}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- agent field ---------- */
/* Static dot field on a perspective grid (generated once, see gen_wave.mjs). Reads as many small workers forming one surface —
   the headline's argument, drawn. Columns rise on a phase delay = travelling wave. */
.field{position:absolute; inset:0 -1% 0 auto; width:min(60%,760px); z-index:1; pointer-events:none}
.field svg{width:100%; height:100%; display:block}
.col{animation:swell 4.6s ease-in-out infinite alternate; animation-delay:calc(var(--i) * -.13s)}
@keyframes swell{from{transform:translateY(7px)} to{transform:translateY(-7px)}}

/* Narrow: the field becomes a band under the copy, never behind it. */
@media (max-width:900px){
  body{padding:32px 16px}
  .banner{min-height:0; padding:40px 24px 175px}
  .field{inset:auto 0 0 0; width:100%; height:150px}
  .copy,.form{max-width:none}
  h1{margin-bottom:26px; font-size:clamp(28px,7.4vw,40px)}
}

/* Motion is decoration: every word must still be readable without it, so
   reduced-motion pins the brand word and drops the rest. */
@media (prefers-reduced-motion:reduce){
  .rotate>span{animation:none; opacity:0}
  .rotate>span.w-sans{opacity:1}
  .col{animation:none}
  .form button{transition:none}
}
</style>
</head>
